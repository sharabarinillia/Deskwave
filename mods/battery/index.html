<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Battery</title>
  <link rel="stylesheet" href="/_sdk/deskwave.css">
  <link rel="stylesheet" href="style.css">
  <script src="/_sdk/deskwave.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main class="battery" id="root">
    <svg class="cell" viewBox="0 0 44 24" aria-hidden="true">
      <rect class="shell" x="1" y="1" width="38" height="22" rx="5"/>
      <rect class="nub" x="40.5" y="8" width="2.5" height="8" rx="1.25"/>
      <rect class="level" id="level" x="4" y="4" height="16" rx="2.5"/>
      <path class="bolt" d="M22.5 4.5 15.5 13h5l-1.5 6.5 7-8.5h-5z"/>
    </svg>
    <div>
      <div class="pct"><span id="pct">–</span><span class="unit" id="unit">%</span></div>
      <div class="state" id="state" data-t="reading">Reading battery…</div>
    </div>
  </main>
</body>
</html>
