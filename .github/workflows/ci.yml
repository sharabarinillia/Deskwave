name: CI

# Checks every branch push and pull request. Version tags are built by release.yml instead.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/check-strings.mjs
      - run: cargo test -p deskwave-core --locked
      - run: cargo clippy -p deskwave-core --all-targets --locked -- -D warnings

  windows:
    name: Build installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npx tauri build
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: Deskwave-Windows
          path: dist/Deskwave-Windows/
          if-no-files-found: error
