name: CI

# Checks every branch push and pull request. Version tags are built by release.yml instead.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/check-strings.mjs
      - run: cargo test -p deskwave-core --locked
      - run: cargo clippy -p deskwave-core --all-targets --locked -- -D warnings

  windows:
    name: Build installers (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npx tauri build
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: Deskwave-Windows
          path: dist/Deskwave-Windows/
          if-no-files-found: error

  macos:
    name: Build app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: cargo clippy -p deskwave --all-targets --locked -- -D warnings
      # One app for Apple Silicon and Intel Macs.
      - run: npx tauri build --target universal-apple-darwin --bundles app
      - run: node scripts/package.mjs target/universal-apple-darwin/release/bundle
      - uses: actions/upload-artifact@v6
        with:
          name: Deskwave-macOS
          path: dist/Deskwave-macOS.dmg
          if-no-files-found: error
