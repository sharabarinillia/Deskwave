[workspace]
resolver = "2"
members = ["crates/deskwave-core", "src-tauri"]
# The app only builds on Windows; plain `cargo test` elsewhere runs the core tests.
default-members = ["crates/deskwave-core"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/sharabarinillia/Deskwave"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
