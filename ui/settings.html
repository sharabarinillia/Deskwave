<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deskwave</title>
  <link rel="stylesheet" href="css/fluent.css">
  <link rel="stylesheet" href="css/settings.css">
  <script type="module" src="js/settings.js"></script>
</head>
<body>
  <nav class="nav" data-i18n-attr="aria-label:nav.label">
    <div class="identity">
      <img src="img/icon.png" alt="" width="48" height="48">
      <div>
        <strong>Deskwave</strong>
        <span id="summary"></span>
      </div>
    </div>
    <button class="nav-item" data-page="wallpaper" aria-current="page"><svg class="icon"><use href="img/icons.svg#i-image"/></svg><span data-i18n="nav.wallpaper"></span></button>
    <button class="nav-item" data-page="widgets"><svg class="icon"><use href="img/icons.svg#i-widgets"/></svg><span data-i18n="nav.widgets"></span></button>
    <button class="nav-item" data-page="mods"><svg class="icon"><use href="img/icons.svg#i-package"/></svg><span data-i18n="nav.mods"></span><span class="badge" id="mods-badge" hidden></span></button>
    <button class="nav-item" data-page="general"><svg class="icon"><use href="img/icons.svg#i-settings"/></svg><span data-i18n="nav.general"></span></button>
    <button class="nav-item" data-page="privacy"><svg class="icon"><use href="img/icons.svg#i-shield"/></svg><span data-i18n="nav.privacy"></span></button>
  </nav>

  <main class="content">
    <div class="infobar critical" id="notice" role="alert" hidden>
      <svg class="icon"><use href="img/icons.svg#i-warning"/></svg><span></span>
    </div>
    <div class="infobar accent" id="startup-prompt" hidden>
      <svg class="icon"><use href="img/icons.svg#i-power"/></svg>
      <div class="infobar-text">
        <strong data-i18n="startup.promptTitle"></strong>
        <span data-i18n="startup.promptText"></span>
      </div>
      <div class="row-actions">
        <button class="btn primary" id="startup-yes" data-i18n="startup.turnOn"></button>
        <button class="btn" id="startup-no" data-i18n="startup.notNow"></button>
      </div>
    </div>

    <section class="page" id="page-wallpaper" aria-labelledby="h-wallpaper">
      <h1 id="h-wallpaper" data-i18n="nav.wallpaper"></h1>
      <div class="monitors" id="monitors" role="radiogroup" data-i18n-attr="aria-label:wallpaper.displays"></div>

      <h2 id="presets-title" data-i18n="wallpaper.animated"></h2>
      <div class="gallery" id="presets" role="radiogroup" aria-labelledby="presets-title"></div>

      <h2 id="gradients-title" data-i18n="wallpaper.gradients"></h2>
      <div class="gallery" id="gradients" role="radiogroup" aria-labelledby="gradients-title"></div>
      <section class="editor" id="gradient-editor" aria-labelledby="editor-title" hidden>
        <h3 id="editor-title"></h3>
        <div class="editor-body">
          <div class="editor-preview" id="editor-preview"></div>
          <div class="editor-controls">
            <div class="field">
              <div class="field-label" data-i18n="gradient.colors"></div>
              <div class="swatches" id="swatches"></div>
              <div class="palettes" id="palettes" role="group" data-i18n-attr="aria-label:gradient.startFrom"></div>
            </div>
            <div class="field">
              <div class="field-label" id="style-label" data-i18n="gradient.style"></div>
              <div class="segmented" id="style-group" role="radiogroup" aria-labelledby="style-label"></div>
            </div>
            <div class="field" id="angle-field">
              <label class="field-label" for="angle" data-i18n="gradient.angle"></label>
              <div class="slider-row"><input type="range" id="angle" min="0" max="359" step="1"><output id="angle-value" for="angle"></output></div>
            </div>
            <div class="field">
              <div class="field-label" id="motion-label" data-i18n="gradient.motion"></div>
              <div class="segmented" id="motion-group" role="radiogroup" aria-labelledby="motion-label"></div>
            </div>
            <div class="editor-actions">
              <button class="btn primary" id="gradient-use" data-i18n="gradient.use"></button>
              <button class="btn" id="gradient-cancel" data-i18n="common.cancel"></button>
              <button class="btn subtle danger" id="gradient-delete" data-i18n="common.delete"></button>
            </div>
          </div>
        </div>
      </section>

      <h2 id="files-title" data-i18n="wallpaper.files"></h2>
      <div class="gallery" id="files" role="radiogroup" aria-labelledby="files-title"></div>
      <div class="group">
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-folder"/></svg>
          <div class="row-text">
            <div data-i18n="wallpaper.ownTitle"></div>
            <div class="row-desc" data-i18n="wallpaper.ownText"></div>
          </div>
          <div class="row-actions">
            <button class="btn" data-open="wallpapers" data-i18n="common.openFolder"></button>
            <button class="btn" data-refresh><svg class="icon"><use href="img/icons.svg#i-refresh"/></svg><span data-i18n="common.refresh"></span></button>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="page-widgets" aria-labelledby="h-widgets" hidden>
      <h1 id="h-widgets" data-i18n="nav.widgets"></h1>
      <div class="group">
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-widgets"/></svg>
          <div class="row-text">
            <div data-i18n="widgets.arrangeTitle"></div>
            <div class="row-desc" data-i18n="widgets.arrangeText"></div>
          </div>
          <div class="row-actions"><button class="btn primary" id="edit-widgets" data-i18n="widgets.edit"></button></div>
        </div>
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-info"/></svg>
          <div class="row-text">
            <div data-i18n="widgets.behindTitle"></div>
            <div class="row-desc" data-i18n="widgets.behindText"></div>
          </div>
        </div>
      </div>
      <h2 data-i18n="widgets.available"></h2>
      <div class="group" id="widget-list"></div>
    </section>

    <section class="page" id="page-mods" aria-labelledby="h-mods" hidden>
      <h1 id="h-mods" data-i18n="nav.mods"></h1>
      <p class="lede" data-i18n="mods.lede"></p>
      <div class="infobar caution" id="mods-pending" hidden>
        <svg class="icon"><use href="img/icons.svg#i-info"/></svg><span></span>
      </div>
      <div class="group" id="mod-list"></div>
      <div class="group" id="mod-errors" hidden></div>
      <div class="group">
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-folder"/></svg>
          <div class="row-text">
            <div data-i18n="mods.addTitle"></div>
            <div class="row-desc" data-i18n="mods.addText"></div>
          </div>
          <div class="row-actions">
            <button class="btn" data-open="mods" data-i18n="common.openFolder"></button>
            <button class="btn" data-refresh><svg class="icon"><use href="img/icons.svg#i-refresh"/></svg><span data-i18n="common.refresh"></span></button>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="page-general" aria-labelledby="h-general" hidden>
      <h1 id="h-general" data-i18n="nav.general"></h1>
      <div class="group">
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-globe"/></svg>
          <div class="row-text">
            <label for="language" data-i18n="general.language"></label>
            <div class="row-desc" data-i18n="general.languageText"></div>
          </div>
          <div class="row-actions"><select class="select" id="language"></select></div>
        </div>
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-power"/></svg>
          <div class="row-text">
            <div data-i18n="startup.title"></div>
            <div class="row-desc" data-i18n="startup.text"></div>
          </div>
          <div class="row-actions" id="autostart-toggle"></div>
        </div>
      </div>
      <h2 data-i18n="general.pauseTitle"></h2>
      <p class="lede" data-i18n="general.pauseLede"></p>
      <div class="group" id="pause-options"></div>
    </section>

    <section class="page" id="page-privacy" aria-labelledby="h-privacy" hidden>
      <h1 id="h-privacy" data-i18n="nav.privacy"></h1>
      <div class="status" id="status">
        <span class="status-icon"><svg class="icon"><use id="status-icon" href="img/icons.svg#i-shield"/></svg></span>
        <div>
          <div class="status-title" id="status-title"></div>
          <div class="row-desc" id="status-desc"></div>
        </div>
      </div>
      <h2 data-i18n="privacy.internet"></h2>
      <div class="group">
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-globe"/></svg>
          <div class="row-text">
            <div data-i18n="privacy.switchTitle"></div>
            <div class="row-desc" data-i18n="privacy.switchText"></div>
          </div>
          <div class="row-actions" id="internet-toggle"></div>
        </div>
      </div>
      <h2 data-i18n="privacy.activity"></h2>
      <div class="group" id="net-log"></div>

      <h2 data-i18n="about.title"></h2>
      <div class="notice-terms" role="note">
        <svg class="icon"><use href="img/icons.svg#i-scale"/></svg>
        <strong data-i18n="about.noFees"></strong>
      </div>
      <div class="group">
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-person"/></svg>
          <div class="row-text">
            <div data-i18n="about.madeBy"></div>
            <div class="row-desc">sharabarinillia</div>
          </div>
          <div class="row-actions"><button class="btn" data-link="author"><span data-i18n="about.website"></span><svg class="icon"><use href="img/icons.svg#i-open"/></svg></button></div>
        </div>
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-scale"/></svg>
          <div class="row-text">
            <div data-i18n="about.license"></div>
            <div class="row-desc" data-i18n="about.licenseText"></div>
          </div>
          <div class="row-actions"><button class="btn" data-link="license"><span data-i18n="about.readLicense"></span><svg class="icon"><use href="img/icons.svg#i-open"/></svg></button></div>
        </div>
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-code"/></svg>
          <div class="row-text">
            <div data-i18n="about.source"></div>
            <div class="row-desc selectable">github.com/sharabarinillia/Deskwave</div>
          </div>
          <div class="row-actions"><button class="btn" data-link="source"><span data-i18n="about.openGithub"></span><svg class="icon"><use href="img/icons.svg#i-open"/></svg></button></div>
        </div>
        <div class="row">
          <svg class="icon row-icon"><use href="img/icons.svg#i-info"/></svg>
          <div class="row-text"><div data-i18n="about.version"></div></div>
          <div class="row-value" id="version"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
